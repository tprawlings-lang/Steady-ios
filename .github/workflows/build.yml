name: iOS build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Unzip project
        run: unzip -q Steady-iOS.zip
      - name: Build
        working-directory: Steady
        run: |
          set -o pipefail
          xcodebuild -project Steady.xcodeproj -scheme Steady \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO clean build
