# XcodeGen fallback. If the checked-in Steady.xcodeproj ever fails to open,
# install XcodeGen (`brew install xcodegen`) and run `xcodegen generate` in
# this folder to regenerate it from scratch.
name: Steady
options:
  bundleIdPrefix: com.steady
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Steady:
    type: application
    platform: iOS
    sources:
      - Steady
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steady.emdr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
